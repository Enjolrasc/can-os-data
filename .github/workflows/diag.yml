name: Kaynak testi
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/diag.py > data/diag.txt 2>&1
      - run: |
          git config user.name "can-os-bot"
          git config user.email "can-os-bot@users.noreply.github.com"
          git add data/diag.txt && git commit -m "Kaynak testi sonucu" && git pull --rebase origin main && git push
