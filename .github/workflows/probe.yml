name: Erişim testi
on:
  push:
    paths: ["probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python probe.py
      - name: Kaydet
        run: |
          git config user.name "can-os-bot"; git config user.email "can-os-bot@users.noreply.github.com"
          git add data/probe.json; git commit -m "Erişim testi sonucu" || exit 0
          git pull --rebase --autostash origin main || true; git push
