name: Fiyat topla

on:
  schedule:
    # Saatler UTC'dir (Türkiye = UTC+3).
    # Hafta içi 10:00–23:30 TSİ arası her 30 dakikada bir:
    - cron: "*/30 7-20 * * 1-5"
    # Gece bekçisi: her gece 00:00–08:00 TSİ arası 2 saatte bir (pazar gecesi dahil):
    - cron: "0 21,23,1,3,5 * * *"
  workflow_dispatch: {}   # GitHub'daki "Run workflow" düğmesiyle elle çalıştırma
  push:
    paths:
      - "collect.py"
      - "symbols.json"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fiyatları çek
        run: python collect.py 2>&1 | tee data/son_calisma.log
      - name: Sonuçları depoya kaydet
        if: always()
        run: |
          git config user.name "can-os-bot"
          git config user.email "can-os-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Veri güncellemesi $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
            git pull --rebase --autostash origin main || true
            git push
          fi
